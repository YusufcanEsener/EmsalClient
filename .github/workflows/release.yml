name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Tag Version (e.g. v1.0.1)'
        required: false
        default: ''

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Build and Publish Artifacts
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts and Publish Release
        if: success()
        shell: pwsh
        run: |
          if (Test-Path dist/latest.yml) {
            Copy-Item dist/latest.yml dist/stable.yml -Force
          }
          $files = Get-ChildItem -Path dist -Include *.exe,*.yml,*.blockmap -File
          if ($files) {
            gh release upload ${{ github.ref_name }} $files.FullName --clobber
          }
          gh release edit ${{ github.ref_name }} --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

